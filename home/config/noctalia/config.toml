[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.84999998100101948
    capsule_radius = "auto"
    center = [ "taskbar" ]
    concave_edge_corners = false
    end = [ "summary_2", "tray", "clock", "notifications" ]
    font_family = "Maple Mono Normal"
    margin_ends = 646
    radius_top_left = 0
    radius_top_right = 0
    start = [ "bar", "active_window", "audio_visualizer" ]
    widget_spacing = 10

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "noctalia/screen_recorder:toggle"

[[control_center.shortcuts]]
type = "weather"

[[control_center.shortcuts]]
type = "audio"

[[control_center.shortcuts]]
type = "mic_mute"

[[control_center.shortcuts]]
type = "clipboard"

[desktop_widgets]
enabled = false

[dock]
background_opacity = 0.84999998100101948
concave_edge_corners = false
cross_axis_padding = 4
enabled = false
icon_size = 44
inactive_opacity = 0.9499999787658453
launcher_position = "start"
magnification_scale = 1.5000000074505806
main_axis_padding = 10
pinned = [ "thunar", "firefox", "equibop", "steam", "spotify-launcher", "dev.zed.Zed" ]
radius_bottom_left = 0
radius_bottom_right = 0
show_dots = true

[location]
address = "Ho Chi Minh"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-virtual-xdp-kde-discord", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-virtual-xdp-kde-discord"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "Virtual-virtual-xdp-kde-discord"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-virtual-xdp-kde-discord".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.84999998100101948
position = "top_center"

[osd]
background_opacity = 0.84999998100101948

[plugins]
enabled = [ "noctalia/screen_recorder", "tmelik/system-monitor", "noctalia/umbriel-companion" ]

[shell]
font_family = "Maple Mono Normal"
polkit_agent = true

    [shell.launcher]
    categories = false
    layout = "simple"
    pinned = [
        "dev.kineticwe.Settings",
        "io.github.jensend6965.Embr",
        "spotify-launcher",
        "discord",
        "firefox",
        "com.nousresearch.hermes",
        "feishin",
        "zen",
        "dev.zed.Zed",
        "com.discordapp.Discord",
        "org.jeffvli.feishin"
    ]

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Tokyo-Night"
community_palette = "Catppuccin Frappe Blue"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "umbriel" ]
    community_ids = [ "feishin", "zen-browser", "fastfetch" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 3600

    [wallpaper.default]
    path = "/home/jensend/Pictures/Wallpapers/maligne-lake-from-spirit-island-jasper-national-park-backiee-4K.jpg"

    [wallpaper.last]
    path = "/home/jensend/Pictures/Wallpapers/maligne-lake-from-spirit-island-jasper-national-park-backiee-4K.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/jensend/Pictures/Wallpapers/maligne-lake-from-spirit-island-jasper-national-park-backiee-4K.jpg"

[widget.active_window]
display = "text_only"
max_length = 80
show_empty_label = true
title_scroll = "on_hover"

[widget.audio_visualizer]
bands = 10
capsule_fill = "on_surface_variant"
capsule_opacity = 0.14999999999999999
capsule_radius = "auto"
centered = false
mirrored = false

[widget.bar]
show_layout_name = true
type = "noctalia/umbriel-companion:bar"

[widget.clock]
format = "{:%H:%M}"

[widget.divider-left]
color = "#BDBDBD"
interactive = false
text = "\\"
type = "text"

[widget.divider-right]
color = "#BDBDBD"
interactive = false
text = "/"
type = "text"

[widget.media]
max_length = 80

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.summary]
show_cpu_usage = false
show_disk = false
show_download = false
show_gpu_temperature = "on"
show_gpu_usage = "off"
show_gpu_vram = "off"
show_ram = false
show_separators = false
show_swap = false
show_upload = false
type = "tmelik/system-monitor:summary"

[widget.summary_2]
show_cpu_usage = false
show_disk = false
show_download = false
show_gpu_temperature = "on"
show_gpu_usage = "off"
show_gpu_vram = "off"
show_ram = false
show_separators = false
show_swap = false
show_upload = false
type = "tmelik/system-monitor:summary"

[widget.taskbar]
anchor = true
capsule_radius = "auto"
font_family = "Maple Mono Normal"
font_scale = 2.0
font_weight = 400
group_by_workspace = true
group_single_icon_per_app = true
hide_empty_workspaces = true
minimal = true
show_all_outputs = true
workspace_label_placement = "inside"

[widget.tray]
detached_panel = true
drawer = true
match_adjacent_spacing = true
pinned = [ "Fcitx", "Discord", "embr", "equibop" ]

[widget.volume]
show_label = false

[widget.workspaces]
anchor = false
empty_color = "shadow"
occupied_color = "surface_container"
style = "regular"
